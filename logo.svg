<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Butterfly graphic -->
  <g fill="none" stroke="#5fb8c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left upper wing -->
    <path d="M 50 45 Q 35 25 40 10 Q 50 5 60 15 Q 55 30 60 50 Q 55 60 50 45"/>
    <!-- Left lower wing -->
    <path d="M 50 45 Q 40 60 35 75 Q 30 80 40 82 Q 55 75 55 60 Q 55 50 50 45"/>
    <!-- Right upper wing -->
    <path d="M 70 45 Q 85 25 80 10 Q 70 5 60 15 Q 65 30 60 50 Q 65 60 70 45"/>
    <!-- Right lower wing -->
    <path d="M 70 45 Q 80 60 85 75 Q 90 80 80 82 Q 65 75 65 60 Q 65 50 70 45"/>
    <!-- Body -->
    <line x1="60" y1="10" x2="60" y2="80" stroke-width="2"/>
    <!-- Left antenna -->
    <path d="M 58 8 Q 50 0 48 -5" stroke-width="1.8"/>
    <!-- Right antenna -->
    <path d="M 62 8 Q 70 0 72 -5" stroke-width="1.8"/>
    <!-- Antenna tips -->
    <circle cx="48" cy="-5" r="2" fill="#5fb8c4"/>
    <circle cx="72" cy="-5" r="2" fill="#5fb8c4"/>
  </g>

  <!-- Text: Purposefully Designed -->
  <text x="110" y="50" font-family="Georgia, serif" font-size="32" font-weight="400" fill="#9b7bb5" letter-spacing="-0.5">
    Purposefully
  </text>
  <text x="110" y="72" font-family="Georgia, serif" font-size="32" font-weight="400" fill="#9b7bb5" letter-spacing="-0.5">
    Designed
  </text>
</svg>